<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Artifact Downloader</title>
  <style>
    body { width: 260px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; color: #1f2328; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p.note { color: #59636e; margin: 0 0 12px; line-height: 1.4; }
    button { width: 100%; padding: 8px 12px; font-size: 13px; border: 0; border-radius: 6px; background: #21634a; color: #fff; cursor: pointer; }
    button:hover { background: #1b5240; }
    button:disabled { background: #9aa7a0; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    #status.error { color: #b0432f; }
    #status.ok { color: #21634a; }
  </style>
</head>
<body>
  <h1>Claude Artifact Downloader</h1>
  <p class="note">Downloads the HTML of the Claude artifact open in this tab.</p>
  <button id="download-btn">Download artifact HTML</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
